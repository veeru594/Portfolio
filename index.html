    /* LOADER CSS START */
    body.loader-active {
      margin: 0;
      background: #000;
      overflow: hidden
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .loader-svg-container {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    .signature-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .reveal-mask {
      clip-path: polygon(0 0, -10% 0, 0% 100%, 0 100%);
      animation: reveal-signature 2.8s linear forwards;
    }

    @keyframes reveal-signature {
      0% {
        clip-path: polygon(0 0, -10% 0, 0% 100%, 0 100%);
      }

      100% {
        clip-path: polygon(0 0, 100% 0, 110% 100%, 0 100%);
      }
    }

    @keyframes fade-out {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    .loader.fading {
      animation: fade-out 0.8s ease forwards;
    }

    .loader-progress-wrapper {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      animation: setup-reveal 0.5s 0.2s forwards;
    }

    .loader-progress-container {
      width: 100%;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .loader-progress-line {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.1s linear;
    }

    .loader-percentage-container {
      display: flex;
      justify-content: space-between;

    .loader-percentage {

      font-size: 10px;
      letter-spacing: 0.2em;
      font-weight: 300;
      text-transform: uppercase;
    }

    .loader-status {

      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @keyframes setup-reveal {
      to {
        opacity: 1;
        bottom: -20px;
      }
    }

    /* LOADER CSS END */

      display: none;
    }

    }

  <script>
    window.addEventListener('load', () => {
      const loader = document.querySelector('.loader');
      const percentageText = document.querySelector('.loader-percentage');
      const progressLine = document.querySelector('.loader-progress-line');
      const statusText = document.querySelector('.loader-status');


      const duration = 2800; // Match CSS reveal duration
      const startTime = performance.now();

      function update(now) {
        const elapsed = now - startTime;
        const progress = Math.min(100, (elapsed / duration) * 100);

        percentageText.textContent = `${Math.floor(progress)}%`;
        progressLine.style.width = `${progress}%`;

        // Dynamic status text
        if (progress > 20 && progress < 50) statusText.textContent = "Loading Assets";
        if (progress >= 50 && progress < 80) statusText.textContent = "Configuring System";
        if (progress >= 80 && progress < 99) statusText.textContent = "Finalizing";
        if (progress >= 100) statusText.textContent = "Welcome";

        if (progress < 100) {
          requestAnimationFrame(update);
        }
      }

      requestAnimationFrame(update);

      // Start fade out after reveal finishes
      setTimeout(() => {
        if (loader) {
          loader.classList.add('fading');
        }
      }, duration);

      // Cleanup
      setTimeout(() => {
        loader?.remove();
        document.body.classList.remove('loader-active');
        document.body.classList.add('loader-done');
      }, duration + 800);
    });
  </script>
